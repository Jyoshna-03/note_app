<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign Up</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Create account</h1>
    <p class="subtitle">Start writing your notes</p>

    <div class="form-group">
      <label>Full name</label>
      <input type="text" id="name" placeholder="Your name" />
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="At least 6 characters" />
    </div>

    <button class="btn" id="signup-btn">Create Account</button>
    <div class="error" id="error-msg"></div>

    <div class="link-row">
      Already have an account? <a href="login.html">Sign in</a>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    redirectIfLoggedIn();

    document.getElementById('signup-btn').addEventListener('click', async () => {
      const name     = document.getElementById('name').value.trim();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      hideError('error-msg');

      if (!name || !email || !password) {
        showError('error-msg', 'Please fill in all fields.');
        return;
      }

      const result = await signup(name, email, password);

      if (result.error) {
        showError('error-msg', result.error);
      } else {
        window.location.href = 'dashboard.html';
      }
    });
  </script>
</body>
</html>
